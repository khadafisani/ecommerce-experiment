[package]
name = "tosca-market"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "mysql", "json", "migrate", "macros", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.6"
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
sha2 = "0.11"
dotenvy = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
meilisearch-sdk = { version = "0.33", default-features = false, features = ["reqwest", "tls", "jwt_rust_crypto"] }
lettre = { version = "0.11.24", features = ["tokio1-native-tls"] }
hex = "0.4"
img4avif = { version = "0.7", default-features = false }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "compression-zstd", "fs", "trace"] }
